  </g>
  <circle cx="50" cy="42" r="8" fill="#FFC639" opacity="0.25"/>
  
  <!-- Small dark olive leaves #2F3D22 - middle level -->
  <g fill="#2F3D22">
    <ellipse cx="32" cy="52" rx="1.8" ry="4.5" transform="rotate(-20 32 52)"/>
