  <ellipse cx="38" cy="44" rx="3" ry="6.5" transform="rotate(-25 38 44)" fill="#2F3D22"/>
  <ellipse cx="62" cy="44" rx="3" ry="6.5" transform="rotate(25 62 44)" fill="#2F3D22"/>
  <ellipse cx="34" cy="52" rx="2.5" ry="5.5" transform="rotate(-15 34 52)" fill="#2F3D22"/>
  <ellipse cx="66" cy="52" rx="2.5" ry="5.5" transform="rotate(15 66 52)" fill="#2F3D22"/>
  
