    <path d="M16 58 C 12 52, 14 46, 20 42 C 24 40, 28 42, 30 46 C 32 50, 30 56, 26 60 C 22 64, 18 62, 16 58 Z M16 58 C 18 56, 22 52, 26 50 M18 52 L22 50"/>
    <path d="M84 58 C 88 52, 86 46, 80 42 C 76 40, 72 42, 70 46 C 68 50, 70 56, 74 60 C 78 64, 82 62, 84 58 Z M84 58 C 82 56, 78 52, 74 50 M82 52 L78 50"/>
