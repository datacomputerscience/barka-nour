    <line x1="50" y1="42" x2="68" y2="16"/><line x1="50" y1="42" x2="74" y2="22"/><line x1="50" y1="42" x2="80" y2="30"/><line x1="50" y1="42" x2="84" y2="40"/>
    <line x1="50" y1="42" x2="50" y2="12"/><line x1="50" y1="42" x2="86" y2="46"/><line x1="50" y1="42" x2="14" y2="46"/><line x1="50" y1="42" x2="80" y2="56"/><line x1="50" y1="42" x2="20" y2="56"/><line x1="50" y1="42" x2="50" y2="72"/>
