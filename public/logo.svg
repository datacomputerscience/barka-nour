  <path d="M50 42 L50 72 M50 60 C 42 58, 32 58, 26 62 M50 60 C 58 58, 68 58, 74 62" stroke="#FFEB3B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  
  <!-- Top golden wheat - bright yellow glowing -->
  <g fill="#FFC639">
    <ellipse cx="50" cy="18" rx="2.5" ry="6" />
    <ellipse cx="44" cy="24" rx="2.2" ry="5" transform="rotate(-15 44 24)"/>
    <ellipse cx="56" cy="24" rx="2.2" ry="5" transform="rotate(15 56 24)"/>
    <ellipse cx="42" cy="32" rx="2.2" ry="5" transform="rotate(-20 42 32)"/>
