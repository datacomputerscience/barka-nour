    <line x1="50" y1="38" x2="38" y2="18"/><line x1="50" y1="38" x2="32" y2="22"/><line x1="50" y1="38" x2="26" y2="28"/><line x1="50" y1="38" x2="22" y2="36"/>
    <line x1="50" y1="38" x2="62" y2="18"/><line x1="50" y1="38" x2="68" y2="22"/><line x1="50" y1="38" x2="74" y2="28"/><line x1="50" y1="38" x2="78" y2="36"/>
    <line x1="50" y1="38" x2="50" y2="14"/>
  </g>
