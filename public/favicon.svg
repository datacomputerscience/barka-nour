  <ellipse cx="62" cy="46" rx="3" ry="7" transform="rotate(25 62 46)" fill="#3D4F2A"/>
  <ellipse cx="34" cy="54" rx="2.5" ry="6" transform="rotate(-15 34 54)" fill="#3D4F2A"/>
  <ellipse cx="66" cy="54" rx="2.5" ry="6" transform="rotate(15 66 54)" fill="#3D4F2A"/>
