  <path d="M28 78 C 20 70, 14 58, 18 44 C 22 38, 30 36, 36 42 C 42 48, 48 60, 48 72 C 48 78, 38 84, 28 78 Z" fill="#3D4F2A"/>
  <path d="M72 78 C 80 70, 86 58, 82 44 C 78 38, 70 36, 64 42 C 58 48, 52 60, 52 72 C 52 78, 62 84, 72 78 Z" fill="#3D4F2A"/>
